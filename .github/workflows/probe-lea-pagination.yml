name: Probe LEA pagination

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-lea-pagination.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe pagination
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re,urllib.request,pathlib
          def fetch(url,token=None):
              h={"User-Agent":"Mozilla/5.0"}
              if token: h["Authorization"]="Bearer "+token
              req=urllib.request.Request(url,headers=h)
              with urllib.request.urlopen(req,timeout=30) as r:
                  return r.status,r.read().decode("utf-8","replace")
          _,js=fetch("https://degalukainos.ena.lt/assets/FuelPriceSiteApp-D7c-syZH.js")
          m=re.search(r'apiBase:"([^"]+)".{0,1000}?token:"([^"]+)"',js)
          out=[]
          if m:
              base,token=m.group(1),m.group(2)
              for q in [
                  "?per_page=5000",
                  "?perPage=5000",
                  "?limit=5000",
                  "?page=2",
                  "?per_page=1000&page=1",
              ]:
                  try:
                      st,body=fetch(base+"/read/prices"+q,token)
                      obj=json.loads(body)
                      rows=obj.get("data",[]) if isinstance(obj,dict) else []
                      dates=[str(x.get("submitted_at","")) for x in rows if isinstance(x,dict)]
                      out.append(q+" STATUS="+str(st)+" ROWS="+str(len(rows))+
                                 " FIRST="+(dates[0] if dates else "")+
                                 " LAST="+(dates[-1] if dates else "")+
                                 " KEYS="+str(list(obj.keys()) if isinstance(obj,dict) else []))
                      if isinstance(obj,dict):
                          for k,v in obj.items():
                              if k!="data":
                                  out.append("META "+k+"="+str(v)[:1200])
                  except Exception as e:
                      out.append(q+" ERROR="+str(e))
          pathlib.Path("_lea_pagination_probe.txt").write_text("\n".join(out),encoding="utf-8")
          PY

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _lea_pagination_probe.txt
          git commit -m "Probe LEA pagination" || exit 0
          git push
