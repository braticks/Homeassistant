name: Probe LEA history endpoints

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-lea-history.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe historical endpoints
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          import json, re, urllib.request, pathlib

          def fetch(url, token=None):
              headers={"User-Agent":"Mozilla/5.0"}
              if token:
                  headers["Authorization"]="Bearer "+token
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                  return r.status, r.read().decode("utf-8","replace")

          _, js = fetch("https://degalukainos.ena.lt/assets/FuelPriceSiteApp-D7c-syZH.js")
          m=re.search(r'apiBase:"([^"]+)".{0,1000}?token:"([^"]+)"',js)
          out=[]
          if not m:
              out.append("CONFIG_NOT_FOUND")
          else:
              base, token=m.group(1),m.group(2)
              tests=[
                  "/read/prices/latest?date=2026-09-18",
                  "/read/prices?date=2026-09-18",
                  "/read/prices/2026-09-18",
                  "/read/prices/history?date=2026-09-18",
                  "/read/prices/history",
              ]
              for path in tests:
                  try:
                      st, body=fetch(base+path,token)
                      line=f"{path} STATUS={st} LEN={len(body)}"
                      try:
                          obj=json.loads(body)
                          rows=obj.get("data",[]) if isinstance(obj,dict) else []
                          nonnull=sum(1 for x in rows if isinstance(x,dict) and x.get("price") is not None)
                          dates=sorted({
                              str(x.get("submitted_at",""))[:10]
                              for x in rows
                              if isinstance(x,dict) and x.get("submitted_at")
                          })
                          line+=f" ROWS={len(rows)} NONNULL={nonnull} DATES={dates[-5:]}"
                      except Exception:
                          line+=" BODY="+body[:300]
                      out.append(line)
                  except Exception as e:
                      out.append(f"{path} ERROR={e}")

          pathlib.Path("_lea_history_probe.txt").write_text("\n".join(out),encoding="utf-8")
          PY

      - name: Commit result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _lea_history_probe.txt
          git commit -m "Probe LEA historical endpoints" || exit 0
          git push
