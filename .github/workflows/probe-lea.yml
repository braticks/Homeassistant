name: Probe LEA fuel data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-lea.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe LEA public API
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          import re, urllib.request, pathlib

          headers={"User-Agent":"Mozilla/5.0"}
          def get(url, headers2=None):
              h=dict(headers)
              if headers2: h.update(headers2)
              req=urllib.request.Request(url,headers=h)
              with urllib.request.urlopen(req,timeout=30) as r:
                  return r.status, r.read().decode("utf-8","replace")

          app="https://degalukainos.ena.lt/assets/FuelPriceSiteApp-D7c-syZH.js"
          status, js=get(app)
          out=[f"APP_STATUS={status}",f"APP_LEN={len(js)}"]

          for needle in ["apiBase","token","/read/prices/latest"]:
              p=js.find(needle)
              if p>=0:
                  out.append("SNIPPET="+js[max(0,p-350):p+900])

          m=re.search(r'apiBase:"([^"]+)".{0,1000}?token:"([^"]+)"',js)
          if not m:
              out.append("CONFIG_NOT_FOUND")
          else:
              api_base, token=m.group(1),m.group(2)
              out.append("API_BASE="+api_base)
              out.append("TOKEN="+token)
              url=api_base+"/read/prices/latest"
              for label, extra in [
                  ("NOAUTH",{}),
                  ("AUTH",{"Authorization":"Bearer "+token}),
              ]:
                  try:
                      st, body=get(url,extra)
                      out.append(f"{label}_STATUS={st}")
                      out.append(f"{label}_BODY="+body[:3000])
                      if label=="AUTH":
                          import json
                          payload=json.loads(body)
                          rows=payload.get("data",[])
                          out.append("ROW_COUNT="+str(len(rows)))
                          nonnull=[x for x in rows if x.get("price") is not None]
                          out.append("NONNULL_COUNT="+str(len(nonnull)))
                          out.append("NONNULL_SAMPLE="+json.dumps(nonnull[:12],ensure_ascii=False))
                          kaunas=[x for x in nonnull if "Kauno" in str(x.get("municipality","")) or "Kaunas" in str(x.get("address",""))]
                          out.append("KAUNAS_NONNULL_COUNT="+str(len(kaunas)))
                          out.append("KAUNAS_SAMPLE="+json.dumps(kaunas[:30],ensure_ascii=False))
                  except Exception as e:
                      out.append(f"{label}_ERROR={e}")

          pathlib.Path("_lea_probe.txt").write_text("\n".join(out),encoding="utf-8")
          PY

      - name: Commit probe
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _lea_probe.txt
          git commit -m "Probe LEA public API" || exit 0
          git push
