name: Probe LEA fuel data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-lea.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Discover LEA data endpoints
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          import re, urllib.request, urllib.parse, pathlib

          base = "https://degalukainos.ena.lt/"
          headers = {"User-Agent": "Mozilla/5.0"}
          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read().decode("utf-8", "replace")

          html = get(base)
          out = []
          out.append("HTML_LENGTH=" + str(len(html)))
          scripts = re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', html, re.I)
          links = re.findall(r'<link[^>]+href=["\']([^"\']+)["\']', html, re.I)
          out.append("SCRIPTS:")
          out.extend(scripts)
          out.append("LINKS:")
          out.extend(links)

          candidates = []
          for src in scripts:
              url = urllib.parse.urljoin(base, src)
              try:
                  js = get(url)
              except Exception as e:
                  out.append(f"FETCH_ERROR {url}: {e}")
                  continue
              out.append(f"JS {url} LENGTH={len(js)}")
              patterns = [
                  r'https?://[^"\'\s)]+',
                  r'["\']([^"\']*(?:api|json|csv|xlsx|download|export|fuel|degal)[^"\']*)["\']',
              ]
              found = set()
              for pat in patterns:
                  for m in re.finditer(pat, js, re.I):
                      v = m.group(0 if m.lastindex is None else 1)
                      if len(v) < 300:
                          found.add(v)
              for v in sorted(found):
                  out.append("CANDIDATE " + v)

          pathlib.Path("_lea_probe.txt").write_text("\n".join(out), encoding="utf-8")
          PY

      - name: Commit probe
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _lea_probe.txt
          git commit -m "Probe LEA fuel data endpoint" || exit 0
          git push
